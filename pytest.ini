[pytest]
testpaths = tests
# rootdir on sys.path, so `tests.*` and the service packages import cleanly.
addopts = -q --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    e2e: needs the full docker stack running (docker compose up -d)
    ui: drives a real browser through Playwright; needs the stack too
    real_plans: the plan limits apply as in production (otherwise a teacher without a plan generates freely)
filterwarnings =
    ignore::DeprecationWarning
