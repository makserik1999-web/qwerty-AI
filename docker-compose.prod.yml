# Production, on one VPS with Docker. Layered over docker-compose.yml:
#
#     COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml    (in .env)
#
# so every plain `docker compose ...` on the server includes this file, and
# nobody has to remember a -f flag at 2 a.m. deploy/init-env.sh writes that
# line; docs/DEPLOY.md is the walkthrough.
#
# What this adds to the stack, and nothing else:
#   - the certificate comes from Let's Encrypt (certbot, renewing itself)
#     instead of a directory on the host;
#   - a backup service: the database every night, the rendered videos
#     mirrored beside it;
#   - a restore service that only ever runs when asked (profile "restore").
# Ports, TLS and the cookie flag stay where they were: .env (FRONTEND_PORT=80,
# HTTPS_PORT=443, HTTPS_TERMINATED=1).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    environment:
      # certbot keeps the files under live/<cert-name>/; init-tls.sh names
      # the certificate "anyq", so this path does not depend on the domain.
      - TLS_CERT_DIR=/etc/nginx/certs/live/anyq
      # www.<domain> and any other alias: a 301 to TLS_SERVER_NAME.
      - TLS_REDIRECT_HOSTS=${TLS_REDIRECT_HOSTS:-}
    volumes:
      # Same mount point as the development certificate in docker-compose.yml,
      # which compose merges by target - so this replaces that bind mount
      # rather than adding a second one. The whole letsencrypt tree, not just
      # live/: the files in live/ are symlinks into archive/.
      - letsencrypt:/etc/nginx/certs:ro
      # Where certbot leaves the token Let's Encrypt fetches over HTTP.
      - acme_webroot:/var/www/acme:ro

  certbot:
    image: certbot/certbot:v5.8.0
    container_name: anyq-certbot
    restart: unless-stopped
    # Checks twice a day; certbot only renews within 30 days of expiry, so
    # almost every run is a no-op. The frontend notices the new files and
    # reloads nginx by itself (docker-entrypoint.d/15-anyq-tls.sh).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/acme --quiet; sleep 12h & wait $${!}; done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme_webroot:/var/www/acme
    # Not on anyq-network: it talks to Let's Encrypt and to nothing in the
    # stack, so it is left on the project's default network, away from mongo.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    logging: *logging

  # Nightly backups. The same image as the database, so mongodump matches the
  # server version and nothing new is pulled. It logs in as the app user:
  # readWrite on the one database is all a dump of that database needs, and
  # the root password stays out of this container.
  backup:
    image: mongo:7
    container_name: anyq-backup
    restart: unless-stopped
    entrypoint: ["bash", "/opt/anyq/backup.sh"]
    command: ["loop"]
    environment:
      # No database in the path: mongodump and mongorestore take it as --db
      # and --nsInclude, and a database in the URI clashes with --archive.
      - BACKUP_MONGO_URI=mongodb://${MONGO_APP_USER:-}:${MONGO_APP_PASSWORD:-}@mongo:27017/?authSource=${DATABASE_NAME:-anyq_db}
      - DATABASE_NAME=${DATABASE_NAME:-anyq_db}
      # 21:00 UTC is 02:00 in Kazakhstan (UTC+5): nobody is in a lesson.
      - BACKUP_HOUR_UTC=${BACKUP_HOUR_UTC:-21}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
    volumes:
      # On the host, outside every docker volume, so `docker compose down -v`
      # cannot take the backups with the data. Still the same machine: copy
      # it somewhere else too (docs/DEPLOY.md, "Копия бэкапов").
      - ${BACKUP_DIR:-/var/backups/anyq}:/backups
      - media_data:/media:ro
      - ./deploy/backup.sh:/opt/anyq/backup.sh:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - anyq-network
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Healthy means a dump finished within the last 26 hours - a day plus
    # slack - so a backup that silently stopped shows up in `docker compose
    # ps` and in deploy/monitor.sh, not on the day it is needed.
    healthcheck:
      test: ["CMD", "bash", "/opt/anyq/backup.sh", "check"]
      interval: 1m
      timeout: 10s
      retries: 2
      start_period: 15m
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    logging: *logging

  # Only for deploy/restore.sh. The one container with the media volume
  # writable and the backups read-only - the opposite of the service above.
  restore:
    image: mongo:7
    profiles: ["restore"]
    entrypoint: ["bash", "/opt/anyq/backup.sh"]
    environment:
      - BACKUP_MONGO_URI=mongodb://${MONGO_APP_USER:-}:${MONGO_APP_PASSWORD:-}@mongo:27017/?authSource=${DATABASE_NAME:-anyq_db}
      - DATABASE_NAME=${DATABASE_NAME:-anyq_db}
    volumes:
      - ${BACKUP_DIR:-/var/backups/anyq}:/backups:ro
      - media_data:/media
      - ./deploy/backup.sh:/opt/anyq/backup.sh:ro
    networks:
      - anyq-network
    security_opt:
      - no-new-privileges:true
    # The videos belong to uid 10001 (the agent, the backend and the exporter
    # run as it); copying them back needs to write into that directory and
    # hand the files back to their owner. Those two, and nothing else.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    logging: *logging

volumes:
  letsencrypt:
  acme_webroot:
