services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: anyq-mongo
    restart: unless-stopped
    # Authentication, which this database ran without. It is on the internal
    # docker network rather than the internet, but that network holds four
    # other containers and one of them - the agent - executes code a language
    # model wrote. "Not reachable from outside" was the only thing standing
    # between that code and every chat, session and account in here.
    command: ["mongod", "--auth"]
    environment:
      # Only used when the data directory is EMPTY - a fresh install. The
      # official entrypoint creates this user and then hands over to the
      # command above. An existing volume is never re-initialised, which is
      # why scripts/mongo_enable_auth.sh exists: it creates the same two users
      # in place, before --auth starts being enforced.
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-}
      - MONGO_INITDB_DATABASE=${DATABASE_NAME:-anyq_db}
    volumes:
      - mongo_data:/data/db
    networks:
      - anyq-network
    healthcheck:
      # Authenticated, because under --auth an anonymous ping is refused - so
      # an unauthenticated healthcheck would report this container unhealthy
      # forever and nothing that depends on it would ever start.
      test: ["CMD", "mongosh", "--quiet",
             "-u", "${MONGO_ROOT_USER:-}", "-p", "${MONGO_ROOT_PASSWORD:-}",
             "--authenticationDatabase", "admin",
             "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anyq-backend
    restart: unless-stopped
    environment:
      # Least privilege: this user has readWrite on one database and nothing
      # else - no other database, no administration. authSource names where
      # the user was created, which is that same database, not admin.
      - MONGO_URL=mongodb://${MONGO_APP_USER:-}:${MONGO_APP_PASSWORD:-}@mongo:27017/${DATABASE_NAME:-anyq_db}?authSource=${DATABASE_NAME:-anyq_db}
      - DATABASE_NAME=${DATABASE_NAME:-anyq_db}
      # Agent channel secret - must match AGENT_SECRET on the agent service.
      # Set it in .env. Empty => backend refuses agent connections (fail closed).
      - AGENT_SECRET=${AGENT_SECRET:-}
      # How long to wait for the agent to confirm it has a request before
      # declaring the send lost. Forwarded rather than only read, because a
      # setting that exists to be turned and cannot be reached from .env is a
      # mistake this compose file has already made twice.
      - AGENT_ACK_TIMEOUT_SEC=${AGENT_ACK_TIMEOUT_SEC:-20}
      # How long an unanswered request is kept before the person is told it
      # failed and their quota is handed back. Must stay above the agent's
      # own deadline (AGENT_REQUEST_DEADLINE_SEC, 1200 by default), or a
      # render that is still going gets written off as lost.
      - PENDING_REQUESTS_TTL_SEC=${PENDING_REQUESTS_TTL_SEC:-1800}
      # The session cookie gets its Secure flag from the same switch that turns
      # TLS on, so HTTPS cannot be enabled while the cookie still travels in
      # clear text on any plain-HTTP request. COOKIE_SECURE overrides it for a
      # deployment where TLS is terminated further out, by something this
      # stack knows nothing about.
      - HTTPS_TERMINATED=${HTTPS_TERMINATED:-0}
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      # Explicit allowlist; credentials are enabled so "*" is never valid here.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Media volume root as seen by the backend (the agent's outputs subdir).
      - MEDIA_DIR=/app/media/outputs
      # Finished exports; written by the exporter, served from here.
      - EXPORT_DIR=/app/media/exports
      - EXPORT_MAX_PER_HOUR=${EXPORT_MAX_PER_HOUR:-5}
      # Generation quotas: what makes "logged-in only" bound load rather
      # than just keep anonymous users out. CONCURRENT is the one that
      # matters - a render holds the single agent for about 90 seconds.
      - GENERATION_MAX_CONCURRENT=${GENERATION_MAX_CONCURRENT:-1}
      - GENERATION_MAX_PER_HOUR=${GENERATION_MAX_PER_HOUR:-15}
      - GENERATION_MAX_PER_DAY=${GENERATION_MAX_PER_DAY:-50}
      - GENERATION_QUEUE_MAX=${GENERATION_QUEUE_MAX:-20}
      - SIGNUP_MAX_PER_HOUR=${SIGNUP_MAX_PER_HOUR:-100}
      - LOGIN_IP_MAX_FAILURES=${LOGIN_IP_MAX_FAILURES:-50}
      # Usernames allowed to read cache statistics - which are other people's
      # questions, so this is a deliberate grant and empty by default. It was
      # read from the environment but never forwarded here, so the allowlist
      # could not be filled at all.
      - ADMIN_USERS=${ADMIN_USERS:-}
      # Part of every cache key, so raising it retires stored answers the
      # current pipeline would no longer produce. config.py says to bump it
      # when the prompts, the model or the renderer change - and it was read
      # from the environment but never forwarded here, so the one setting that
      # exists to be changed on a model switch could not be changed at all.
      - PIPELINE_VERSION=${PIPELINE_VERSION:-v4}
      # Which length a request that names none gets. Forwarded to BOTH
      # services: the backend validates the name and puts it in the cache
      # key, the agent turns it into a character budget. If only one end
      # were configured they would disagree about what was stored.
      - VIDEO_LENGTH_DEFAULT=${VIDEO_LENGTH_DEFAULT:-medium}
      # Render profile a request that names none gets. Forwarded to
      # BOTH services, like the length above: the backend puts it in
      # the cache key, the agent turns it into a manim -q flag.
      - EFFORT_DEFAULT=${EFFORT_DEFAULT:-medium}
      - EXPORT_TTL_HOURS=${EXPORT_TTL_HOURS:-24}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - anyq-network
    volumes:
      # Mount media outputs from agent for serving videos
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anyq-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
      - "${HTTPS_PORT:-3443}:3443"
    environment:
      - BACKEND_URL=http://backend:8000
      - DNS_RESOLVER=${DNS_RESOLVER:-127.0.0.11}
      # TLS. Off by default - on localhost there is no certificate to serve.
      # With it on, 3443 serves HTTPS and 3000 answers with a 301 to it, so
      # nothing is ever served in clear text. The entrypoint REFUSES TO START
      # if the certificate is missing rather than falling back to HTTP, which
      # is the failure nobody would notice.
      - HTTPS_TERMINATED=${HTTPS_TERMINATED:-0}
      - TLS_SERVER_NAME=${TLS_SERVER_NAME:-localhost}
      # Only needed when the public HTTPS port is not 443: $host carries no
      # port, so the redirect would otherwise point at nothing.
      - TLS_PUBLIC_PORT_SUFFIX=${TLS_PUBLIC_PORT_SUFFIX:-}
    volumes:
      # The certificate, read-only. certbot writes fullchain.pem and
      # privkey.pem under /etc/letsencrypt/live/<domain>/ with exactly these
      # names, so a real certificate is a change of source path and nothing
      # else. scripts/make_dev_cert.sh puts a self-signed pair here for
      # testing that the path works at all.
      - ${TLS_CERT_SOURCE:-./frontend/certs}:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - anyq-network
    healthcheck:
      # Whichever port this container is actually serving on. With TLS on, 3000
      # answers a 301 and nothing else, so an HTTP probe there fails and the
      # container reports unhealthy forever - which stops anything with a
      # `depends_on: service_healthy` on it from ever starting. Following the
      # redirect instead would be worse: it points at the PUBLIC https port,
      # which in production is 443 and is not what this container listens on.
      # --no-check-certificate because a self-signed certificate is a valid
      # local setup and this probe is not the thing that vouches for it.
      test: ["CMD-SHELL",
             "wget -q -O /dev/null --no-check-certificate https://127.0.0.1:3443/ || wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true

  # AI Agent Service
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: anyq-agent
    restart: unless-stopped
    environment:
      - AGENT_WS_URL=ws://backend:8000/ws/agent
      - AGENT_SECRET=${AGENT_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openrouter}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-google/gemini-3.8-flash}
      - GEMINI_MAX_TOKENS=${GEMINI_MAX_TOKENS:-20000}
      # spoon_ai reads the model from {PROVIDER}_MODEL (GEMINI_MODEL), not
      # DEFAULT_MODEL; keep both in sync.
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      # OpenRouter is the live chat path: one key reaches every model, so
      # switching model is an env change rather than a code change. Vision
      # still calls the Google API directly and needs GEMINI_API_KEY.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-3.8-flash}
      - OPENROUTER_MAX_TOKENS=${OPENROUTER_MAX_TOKENS:-20000}
      - LLM_REASONING_EFFORT=${LLM_REASONING_EFFORT:-low}
      # Narration. The key lives in the agent only; the render subprocess
      # is handed finished audio, never a credential.
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY:-}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-}
      - NARRATION_ENABLED=${NARRATION_ENABLED:-1}
      - NARRATION_VOICE=${NARRATION_VOICE:-aigul}
      - VIDEO_LENGTH_DEFAULT=${VIDEO_LENGTH_DEFAULT:-medium}
      - EFFORT_DEFAULT=${EFFORT_DEFAULT:-medium}
      # How fast things happen on screen. The pacing guard caps every
      # run_time that was written as a fraction of the spoken sentence, so
      # a fade is a fade rather than five seconds of slow motion.
      - ANIM_RUN_TIME_CAP=${ANIM_RUN_TIME_CAP:-1.0}
      - ANIM_EXIT_RUN_TIME=${ANIM_EXIT_RUN_TIME:-0.35}
      # Test mode: render a stub Manim video without calling any LLM
      # (used for sandbox/render regression checks; a real LLM key is
      # otherwise required for AI features).
      - DOC_SNIPPET_MODE=${DOC_SNIPPET_MODE:-0}
      - MANIM_ALLOW_LATEX=${MANIM_ALLOW_LATEX:-1}
      - MANIM_MCP_SERVER_SCRIPT=/app/manim-mcp-server/src/manim_server.py
      # Explicit output dir (the shared media volume is mounted below).
      - MANIM_OUTPUT_DIR=/app/manim-mcp-server/src/media/outputs
      # Telemetry: one JSON line per request - which stage ran, whether the
      # render worked first time, how long it took. No question text, only a
      # sha256 of it, so the counting works and the reading does not.
      #
      # It used to be written into the tmpfs, which kept it off the read-only
      # rootfs and also erased it on every restart. Stdout is no better here:
      # docker's log is per-container, so `up --build` starts an empty one.
      # Both sinks being ephemeral meant the history was gone exactly when it
      # was wanted - after a day of work the file held two lines, and "how
      # often does a render succeed first time" had to be answered from
      # scratch. Its own volume fixes that; /app/logs already exists in the
      # image owned by appuser, so the volume inherits a writable directory.
      - ANYQ_TELEMETRY_PATH=${ANYQ_TELEMETRY_PATH:-/app/logs/runs.jsonl}
      # Optional: OpenAI/Anthropic keys if you want to use those providers
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - anyq-network
    volumes:
      # Persist generated videos. The whole media dir is mounted (manim writes
      # intermediates into media/videos as well as the final outputs/).
      - media_data:/app/manim-mcp-server/src/media
      # Its own volume rather than a corner of media_data: telemetry is
      # operational data and media is user content. Clearing out old videos
      # must not take the record of what happened with it - and media_data is
      # mounted into the backend, which serves files out of it.
      - agent_logs:/app/logs
    # Sandbox: non-root user (in image), no capabilities, no new privileges,
    # read-only rootfs (tmpfs for /tmp), hard resource caps. Outbound network
    # is restricted by the AST script validator (import whitelist) at runtime.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
          pids: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; d=urllib.request.urlopen('http://backend:8000/health', timeout=5); assert b'connected' in d.read()"]
      interval: 20s
      timeout: 10s
      retries: 4
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Export worker: GIF/mp4 clips, frames and teacher decks.
  exporter:
    build:
      context: ./exporter
      dockerfile: Dockerfile
    container_name: anyq-exporter
    restart: unless-stopped
    environment:
      # The same least-privilege user as the backend.
      - MONGO_URL=mongodb://${MONGO_APP_USER:-}:${MONGO_APP_PASSWORD:-}@mongo:27017/${DATABASE_NAME:-anyq_db}?authSource=${DATABASE_NAME:-anyq_db}
      - DATABASE_NAME=${DATABASE_NAME:-anyq_db}
      # Reads the rendered videos, writes results beside them. Same volume as
      # the backend, which is what serves the finished file.
      - MEDIA_DIR=/app/media/outputs
      - EXPORT_DIR=/app/media/exports
      - EXPORT_MAX_OUTPUT_BYTES=${EXPORT_MAX_OUTPUT_BYTES:-20971520}
      - EXPORT_JOB_TIMEOUT_SEC=${EXPORT_JOB_TIMEOUT_SEC:-600}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - anyq-network
    volumes:
      - media_data:/app/media
    # ffmpeg is CPU-hungry by nature; cap it so an export cannot starve the
    # renderer or the API on the same box.
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"
          pids: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Healthy means the poll loop ran recently, not merely that the process is
    # alive: a worker wedged on a dead connection would otherwise report fine
    # while nothing gets encoded.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys;p='/tmp/exporter-heartbeat';sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<60 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


networks:
  anyq-network:
    driver: bridge

volumes:
  mongo_data:
  media_data:
  agent_logs: